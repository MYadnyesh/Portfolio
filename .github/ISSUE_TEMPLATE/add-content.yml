name: Add content
description: Add a LinkedIn post, article or anything else you published to yadnyesh.dev/content.
title: "[Content] "
body:
  - type: markdown
    attributes:
      value: |
        Paste the link and the text. Submitting this issue adds the entry to the site automatically (only when the repository owner opens it) and closes the issue with a link. If something is wrong with the input, a comment explains what to fix: edit the issue, then close and reopen it to retry.
  - type: input
    id: link
    attributes:
      label: Link
      description: The URL of the original post or article. Tracking parameters are removed automatically.
      placeholder: https://www.linkedin.com/posts/...
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: Text
      description: For a post, paste the full text exactly as published. For an article or video, a two or three sentence summary. The first line of a post becomes its headline on the site.
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Format
      options:
        - Post
        - Article
        - Carousel
        - Video
        - Newsletter
        - Talk
      default: 0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Detect from link
        - LinkedIn
        - X
        - Medium
        - Substack
        - YouTube
        - GitHub
        - Other
      default: 0
    validations:
      required: true
  - type: input
    id: published
    attributes:
      label: Published on
      description: YYYY-MM-DD. Leave empty for today.
      placeholder: "2026-10-06"
  - type: input
    id: title
    attributes:
      label: Title
      description: Optional. Use for articles, videos and talks. Posts use their first line.
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Optional, comma-separated (for example, ai, evals, nextjs).
  - type: checkboxes
    id: featured
    attributes:
      label: Homepage
      options:
        - label: Pin this to the top of the homepage "Latest writing" section
