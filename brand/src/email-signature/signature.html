<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Email signature</title>
</head>
<!--
  This is a light variant, not the site's dark theme. A dark block dropped
  into someone's inbox reads as an ad and can fight a recipient's own
  (often white) email theme, so ink-on-paper reads better here while still
  using the same ink / wine / gold palette. Everything below is inline
  styles and a table layout on purpose: Outlook desktop renders email HTML
  with Word's engine, which ignores <style> blocks and most modern CSS.

  HOW TO INSTALL:
  1. Open this file in a browser.
  2. Click into the signature block below, Ctrl+A to select it, Ctrl+C to copy.
  3. Paste into your email client's signature editor (Gmail: Settings ->
     General -> Signature; Outlook: File -> Options -> Mail -> Signatures).
  4. The logo image loads from https://yadnyesh.dev/images/ym-mark.png — an
     email signature needs a publicly-hosted image, not a local file, so it
     points at the copy already live on the deployed site rather than the
     touched-up brand/assets/ym-mark-clean.png used elsewhere in this folder.
     At 40px the difference is not visible; see brand/README.md.
-->
<body style="margin:0; padding:24px; background:#ffffff; font-family: Arial, Helvetica, sans-serif;">

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; width:560px; max-width:100%;">
  <tr>
    <td style="padding:0; vertical-align:middle;" width="48">
      <img src="https://yadnyesh.dev/images/ym-mark.png" width="40" height="40" alt="YM"
           style="display:block; width:40px; height:40px;" />
    </td>
    <td style="padding:0 0 0 6px; vertical-align:middle; border-left:2px solid #7d1f2e;" width="1"></td>
    <td style="padding:0 0 0 14px; vertical-align:middle;">
      <div style="font-family: Arial, Helvetica, sans-serif; font-weight:bold; font-size:15px; color:#0a0908; line-height:1.3;">
        Yadnyesh Mulay
      </div>
      <div style="font-family: Arial, Helvetica, sans-serif; font-size:12px; color:#56514a; line-height:1.5; margin-top:1px;">
        AI-First Full-Stack Developer &middot; Business &amp; AI Consultant
      </div>
    </td>
  </tr>
  <tr>
    <td colspan="3" style="padding:12px 0 0 0;">
      <div style="border-top:1px solid #d8d2c4; padding-top:10px; font-family: Arial, Helvetica, sans-serif; font-size:12px; color:#56514a; line-height:1.6;">
        <a href="https://yadnyesh.dev" style="color:#56514a; text-decoration:none;">yadnyesh.dev</a>
        &nbsp;&middot;&nbsp;
        <a href="https://calendly.com/yadnyeshmulay/30min" style="color:#7d1f2e; text-decoration:none; font-weight:bold;">Book a call</a>
        &nbsp;&middot;&nbsp;
        <a href="https://linkedin.com/in/yadnyesh-mulay" style="color:#56514a; text-decoration:none;">LinkedIn</a>
        &nbsp;&middot;&nbsp;
        <a href="https://github.com/MYadnyesh" style="color:#56514a; text-decoration:none;">GitHub</a>
      </div>
    </td>
  </tr>
</table>

</body>
</html>
