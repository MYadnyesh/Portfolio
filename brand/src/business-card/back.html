<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Business card — back</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../_tokens.css" />
<style>
  @page { size: 3.75in 2.25in; margin: 0; }
  html, body {
    margin: 0; padding: 0; width: 3.75in; height: 2.25in;
    background: var(--color-bg);
  }
  .card { position: relative; width: 3.75in; height: 2.25in; overflow: hidden; }
  .trim { position: absolute; inset: 0.125in; outline: 1px dashed rgba(232, 228, 220, 0.18); pointer-events: none; }
  .safe {
    position: absolute; inset: 0.28in;
    display: flex; align-items: center; justify-content: space-between; gap: 0.22in;
  }
  .contact { display: flex; flex-direction: column; gap: 0.12in; }
  .row { display: flex; flex-direction: column; gap: 0.02in; }
  .label {
    font-family: var(--font-mono); font-size: 6.3pt; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.14em; color: var(--color-fg-subtle);
  }
  .value {
    font-family: var(--font-mono); font-size: 8.2pt; color: var(--color-fg);
    letter-spacing: 0.01em;
  }
  .qr-block { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
  .qr-block img { width: 0.86in; height: 0.86in; display: block; border-radius: 2px; }
  .qr-caption {
    margin-top: 0.08in;
    font-family: var(--font-mono); font-size: 6.1pt; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-fg-muted);
    text-align: center; line-height: 1.4; max-width: 1in;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="trim"></div>
    <div class="safe">
      <div class="contact">
        <div class="row"><span class="label">Email</span><span class="value">yadnyeshmulay@gmail.com</span></div>
        <div class="row"><span class="label">Web</span><span class="value">yadnyesh.dev</span></div>
        <div class="row"><span class="label">LinkedIn</span><span class="value">/in/yadnyesh-mulay</span></div>
        <div class="row"><span class="label">GitHub</span><span class="value">/MYadnyesh</span></div>
      </div>
      <div class="qr-block">
        <img src="../../assets/qr-book-a-call.png" alt="QR code to book a call" />
        <span class="qr-caption">Scan to book<br />a 30-min call</span>
      </div>
    </div>
  </div>
<script>if(!/proof=1/.test(location.search)){document.querySelectorAll(".trim").forEach(function(el){el.style.display="none";});}</script>
</body>
</html>
