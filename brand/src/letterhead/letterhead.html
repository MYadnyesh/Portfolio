<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Letterhead</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../_tokens.css" />
<style>
  /* US Letter. The body stays light/paper — a full dark page is expensive
     to print and harder to read for long proposal or invoice copy — with
     a dark masthead band carrying the brand, echoing the light/dark
     inversion the site itself uses for its "In the Lab" panel. */
  @page { size: 8.5in 11in; margin: 0; }
  html, body { margin: 0; padding: 0; width: 8.5in; height: 11in; background: #f4ede2; }
  .page { position: relative; width: 8.5in; height: 11in; overflow: hidden; }

  .masthead {
    background: var(--color-bg);
    height: 1.15in;
    padding: 0 0.65in;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 0.16in; }
  .brand img { width: 0.42in; height: auto; opacity: 0.92; }
  .brand-text .name {
    font-family: var(--font-display); font-weight: 700; text-transform: uppercase;
    font-size: 15pt; color: var(--color-fg); letter-spacing: -0.01em; line-height: 1;
  }
  .brand-text .title {
    font-family: var(--font-mono); font-size: 7.5pt; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--color-accent-readable); margin-top: 0.05in;
  }
  .masthead-contact {
    text-align: right; font-family: var(--font-mono); font-size: 7.5pt;
    color: var(--color-fg-muted); line-height: 1.7; letter-spacing: 0.02em;
  }
  .masthead-contact a { color: inherit; text-decoration: none; }

  /* Body area — this is where the actual letter, proposal or invoice copy
     goes. Left intentionally blank in this template. */
  .body { position: absolute; top: 1.15in; left: 0; right: 0; bottom: 0.55in; }

  /* A plain low-opacity <img>, not a CSS mask-image: headless Chromium's
     software rasterizer silently drops mask-image on a file:// page, so it
     renders nothing without erroring. A background/foreground image with
     opacity is the reliable equivalent here. */
  .watermark {
    position: absolute;
    right: -0.6in; bottom: -0.6in;
    width: 3.4in; height: 3.4in;
    opacity: 0.05;
  }

  .footer {
    position: absolute; left: 0.65in; right: 0.65in; bottom: 0.32in;
    border-top: 1px solid #d8d2c4; padding-top: 0.12in;
    display: flex; justify-content: space-between;
    font-family: var(--font-mono); font-size: 7pt; letter-spacing: 0.04em;
    color: var(--color-fg-subtle);
  }
</style>
</head>
<body>
  <div class="page">
    <div class="masthead">
      <div class="brand">
        <img src="../../assets/ym-mark-clean.png" alt="" />
        <div class="brand-text">
          <div class="name">Yadnyesh Mulay</div>
          <div class="title">Full-Stack Development &amp; AI Consulting</div>
        </div>
      </div>
      <div class="masthead-contact">
        <div>yadnyeshmulay@gmail.com</div>
        <div>yadnyesh.dev</div>
      </div>
    </div>

    <img class="watermark" src="../../assets/ym-mark-ink.png" alt="" />
    <div class="body"><!-- letter / proposal / invoice copy goes here --></div>

    <div class="footer">
      <span>Yadnyesh Mulay &middot; Full-Stack &amp; AI Consulting</span>
      <span>yadnyesh.dev</span>
    </div>
  </div>
</body>
</html>
