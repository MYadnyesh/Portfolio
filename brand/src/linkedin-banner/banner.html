<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LinkedIn banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../_tokens.css" />
<style>
  /* LinkedIn banner, exact spec: 1584 x 396px. The profile photo circle
     sits bottom-left (~300px wide, ~180px tall on desktop), so content
     is kept centred-right and clear of the bottom-left corner. */
  html, body { margin: 0; padding: 0; width: 1584px; height: 396px; background: var(--color-bg); overflow: hidden; }
  .banner { position: relative; width: 1584px; height: 396px; }

  /* Static echo of the site's starfield atmosphere. */
  .dots {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 8% 25%, var(--color-fg-subtle) 50%, transparent),
      radial-gradient(1.5px 1.5px at 20% 70%, var(--color-fg-subtle) 50%, transparent),
      radial-gradient(1.5px 1.5px at 35% 15%, var(--color-fg-muted) 50%, transparent),
      radial-gradient(1.5px 1.5px at 46% 55%, var(--color-fg-subtle) 50%, transparent),
      radial-gradient(1.5px 1.5px at 60% 80%, var(--color-fg-subtle) 50%, transparent),
      radial-gradient(1.5px 1.5px at 72% 30%, var(--color-fg-muted) 50%, transparent),
      radial-gradient(1.5px 1.5px at 85% 60%, var(--color-fg-subtle) 50%, transparent),
      radial-gradient(1.5px 1.5px at 93% 20%, var(--color-fg-subtle) 50%, transparent);
    opacity: 0.5;
  }

  .content {
    position: absolute; top: 0; right: 0; bottom: 0;
    width: 62%;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 72px 0 0;
    text-align: right;
  }
  .eyebrow {
    font-family: var(--font-mono); font-size: 15px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.16em; color: var(--color-accent-readable);
    margin: 0 0 14px 0;
  }
  .name {
    font-family: var(--font-display); font-weight: 700; text-transform: uppercase;
    font-size: 64px; letter-spacing: -0.01em; line-height: 0.95; color: var(--color-fg);
    margin: 0;
  }
  .tagline {
    font-family: var(--font-display); font-size: 22px; font-weight: 400; color: var(--color-fg-muted);
    margin: 18px 0 0 0; line-height: 1.4;
  }
  .rule { width: 120px; height: 3px; background: var(--color-accent); margin: 22px 0 22px auto; }
  .url {
    font-family: var(--font-mono); font-size: 15px; letter-spacing: 0.04em; color: var(--color-fg-subtle);
    margin: 0;
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="dots"></div>
    <div class="content">
      <p class="eyebrow">Full-Stack &amp; AI Engineering</p>
      <h1 class="name">Yadnyesh Mulay</h1>
      <p class="tagline">Building AI-native products, and advising teams on AI &amp; agentic AI transformation.</p>
      <div class="rule"></div>
      <p class="url">yadnyesh.dev</p>
    </div>
  </div>
</body>
</html>
