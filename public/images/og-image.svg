<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0b"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#27272a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.3"/>
  
  <!-- Accent gradient orbs -->
  <ellipse cx="200" cy="150" rx="300" ry="200" fill="#eab308" opacity="0.08" filter="url(#blur)"/>
  <ellipse cx="1000" cy="480" rx="250" ry="180" fill="#22d3ee" opacity="0.08" filter="url(#blur)"/>
  
  <defs>
    <filter id="blur">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>
  
  <!-- Main content -->
  <g transform="translate(600, 315)">
    <!-- Logo/Name -->
    <text x="0" y="-80" text-anchor="middle" font-family="Space Grotesk, system-ui, sans-serif" font-size="72" font-weight="700" fill="#fafafa" letter-spacing="-2px">YM</text>
    
    <!-- Title -->
    <text x="0" y="10" text-anchor="middle" font-family="Space Grotesk, system-ui, sans-serif" font-size="36" font-weight="600" fill="#fafafa" letter-spacing="-1px">Yadnyesh Mulay</text>
    
    <!-- Tagline -->
    <text x="0" y="60" text-anchor="middle" font-family="Space Grotesk, system-ui, sans-serif" font-size="22" font-weight="500" fill="#eab308" letter-spacing="-0.5px">AI-first T-shaped Full Stack Developer</text>
    <text x="0" y="95" text-anchor="middle" font-family="Space Grotesk, system-ui, sans-serif" font-size="22" font-weight="500" fill="#22d3ee" letter-spacing="-0.5px">/ Forward-Deploy Engineer</text>
    
    <!-- Divider -->
    <line x1="-120" y1="130" x2="120" y2="130" stroke="#eab308" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Sub-description -->
    <text x="0" y="170" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="18" fill="#a1a1aa" textLength="500" lengthAdjust="spacingAndGlyphs">I build useful software. I understand the full stack. I work with AI.</text>
    
    <!-- Links -->
    <g transform="translate(-140, 220)">
      <circle cx="0" cy="0" r="24" fill="#27272a"/>
      <text x="0" y="8" text-anchor="middle" font-size="20" fill="#fafafa">💻</text>
    </g>
    <g transform="translate(0, 220)">
      <circle cx="0" cy="0" r="24" fill="#27272a"/>
      <text x="0" y="8" text-anchor="middle" font-size="20" fill="#fafafa">🔗</text>
    </g>
    <g transform="translate(140, 220)">
      <circle cx="0" cy="0" r="24" fill="#27272a"/>
      <text x="0" y="8" text-anchor="middle" font-size="20" fill="#fafafa">📧</text>
    </g>
  </g>
  
  <!-- Bottom accent line -->
  <line x1="200" y1="580" x2="1000" y2="580" stroke="#eab308" stroke-width="2" opacity="0.4"/>
  
  <!-- Copyright -->
  <text x="600" y="605" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="#52525b">© 2025 Yadnyesh Mulay · No tracking · No cookies</text>
</svg>